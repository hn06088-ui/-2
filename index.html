<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 뭐 먹지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EAD6;
    --paper-shadow:#E4D6B8;
    --charcoal:#26221C;
    --charcoal-2:#332C23;
    --amber:#D9A441;
    --amber-deep:#A8721F;
    --spice:#B8412E;
    --spice-deep:#7E2A1C;
    --herb:#5C7A5A;
    --herb-deep:#3C5239;
    --navy:#33465C;
    --ink:#2E2A22;
    --ink-soft:#6B6252;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--charcoal);
    color:var(--paper);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width:1040px;
    margin:0 auto;
    padding:48px 24px 80px;
  }
  .signboard{
    text-align:center;
    margin-bottom:40px;
  }
  .signboard .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.3em;
    color:var(--amber);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .signboard h1{
    font-family:'Black Han Sans', sans-serif;
    font-size:clamp(38px, 6vw, 64px);
    margin:0;
    color:var(--paper);
    letter-spacing:0.02em;
    line-height:1.1;
  }
  .signboard h1 span{
    color:var(--amber);
  }
  .signboard p{
    margin:14px auto 0;
    max-width:480px;
    color:#C9BFA9;
    font-size:15px;
    line-height:1.6;
  }

  .board{
    display:grid;
    grid-template-columns:1fr;
    gap:28px;
  }
  @media(min-width:840px){
    .board{grid-template-columns:1.05fr 0.95fr; align-items:start;}
  }

  .order-form{
    background:var(--charcoal-2);
    border:1px solid #463d30;
    border-radius:6px;
    padding:28px 26px 30px;
  }
  .order-form .form-title{
    font-family:'Black Han Sans', sans-serif;
    font-size:20px;
    color:var(--amber);
    margin:0 0 4px;
  }
  .order-form .form-sub{
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:#9A8F79;
    letter-spacing:0.08em;
    margin-bottom:22px;
  }

  .field{margin-bottom:22px;}
  .field:last-of-type{margin-bottom:26px;}
  .field .label{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:10px;
  }
  .field .num{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--amber-deep);
    background:rgba(217,164,65,0.14);
    border:1px solid rgba(217,164,65,0.35);
    padding:1px 7px;
    border-radius:3px;
  }
  .field .label-text{
    font-size:14px;
    font-weight:700;
    color:var(--paper);
  }

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    appearance:none;
    border:1px solid #5a4f3e;
    background:transparent;
    color:#DCD3BE;
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px;
    font-weight:500;
    padding:9px 15px;
    border-radius:20px;
    cursor:pointer;
    transition:all .12s ease;
  }
  .chip:hover{ border-color:var(--amber); color:var(--paper); }
  .chip.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#2E2308;
    font-weight:700;
  }
  .chip.active[data-group="spice"]{
    background:var(--spice);
    border-color:var(--spice);
    color:#FBE9E4;
  }

  .draw-btn{
    width:100%;
    border:none;
    border-radius:4px;
    background:var(--spice);
    color:#FBE9E4;
    font-family:'Black Han Sans', sans-serif;
    font-size:19px;
    letter-spacing:0.03em;
    padding:16px 10px;
    cursor:pointer;
    transition:transform .08s ease, background .15s ease;
  }
  .draw-btn:hover{ background:var(--spice-deep); }
  .draw-btn:active{ transform:scale(0.98); }

  /* ---- receipt ---- */
  .receipt-stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:420px;
    padding-top:6px;
  }
  .placeholder{
    margin-top:60px;
    text-align:center;
    color:#7A705D;
    font-size:14px;
    line-height:1.8;
  }
  .placeholder .big-icon{
    font-family:'Black Han Sans', sans-serif;
    font-size:46px;
    color:#443B2E;
    display:block;
    margin-bottom:6px;
  }

  .receipt{
    width:100%;
    max-width:340px;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Mono', monospace;
    padding:26px 22px 22px;
    position:relative;
    box-shadow:0 18px 34px rgba(0,0,0,0.35);
    animation:printOut .38s ease;
    transform-origin:top center;
  }
  @keyframes printOut{
    from{ transform:scaleY(0.15) translateY(-14px); opacity:0; }
    to{ transform:scaleY(1) translateY(0); opacity:1; }
  }
  .perf{
    position:absolute;
    left:0; right:0;
    height:12px;
    background-image:radial-gradient(circle at 8px 6px, var(--charcoal) 6px, transparent 6.5px);
    background-size:16px 12px;
    background-repeat:repeat-x;
  }
  .perf.top{ top:-6px; }
  .perf.bottom{ bottom:-6px; transform:rotate(180deg); }

  .r-row{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); }
  .r-hr{ border:none; border-top:1px dashed #B7A985; margin:12px 0; }
  .r-store{
    font-family:'Black Han Sans', sans-serif;
    font-size:22px;
    text-align:center;
    color:var(--ink);
    letter-spacing:0.04em;
    margin:6px 0 2px;
  }
  .r-tagline{
    text-align:center;
    font-size:10px;
    color:var(--ink-soft);
    letter-spacing:0.14em;
    margin-bottom:14px;
    text-transform:uppercase;
  }
  .r-cat{
    display:inline-block;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--herb-deep);
    background:rgba(92,122,90,0.15);
    padding:3px 8px;
    border-radius:3px;
    margin-bottom:10px;
  }
  .r-item{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:900;
    font-size:26px;
    line-height:1.25;
    color:var(--ink);
    margin-bottom:8px;
  }
  .r-desc{
    font-family:'Noto Sans KR', sans-serif;
    font-size:12.5px;
    line-height:1.6;
    color:#4A4335;
    margin-bottom:14px;
  }
  .r-meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .spice-meter{ display:flex; gap:3px; }
  .spice-meter span{ font-size:12px; color:#D8CBAA; }
  .spice-meter span.on{ color:var(--spice); }
  .r-order-no{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:14px;
  }
  .stamp{
    position:absolute;
    top:60px;
    right:14px;
    border:2.5px solid var(--spice);
    color:var(--spice);
    font-family:'Black Han Sans', sans-serif;
    font-size:13px;
    padding:5px 8px;
    border-radius:50%;
    transform:rotate(14deg);
    opacity:0.85;
    line-height:1.1;
    text-align:center;
  }

  .again-btn{
    margin-top:18px;
    background:transparent;
    border:1px solid #5a4f3e;
    color:#DCD3BE;
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px;
    font-weight:700;
    padding:10px 22px;
    border-radius:20px;
    cursor:pointer;
  }
  .again-btn:hover{ border-color:var(--amber); color:var(--paper); }
</style>
</head>
<body>
<div class="wrap">

  <div class="signboard">
    <div class="eyebrow">MENU DECISION COUNTER</div>
    <h1>오늘 뭐 <span>먹지?</span></h1>
    <p>조건 몇 개만 골라주시면, 오늘의 메뉴를 주문서에 딱 찍어드릴게요.</p>
  </div>

  <div class="board">
    <div class="order-form">
      <p class="form-title">주문서 작성</p>
      <p class="form-sub">SELECT YOUR CONDITIONS</p>

      <div class="field">
        <div class="label"><span class="num">01</span><span class="label-text">지금 기분은요</span></div>
        <div class="chips" data-group="mood">
          <button class="chip active" data-value="든든하게">든든하게</button>
          <button class="chip" data-value="가볍게">가볍게</button>
          <button class="chip" data-value="매콤하게">매콤하게</button>
          <button class="chip" data-value="힐링">힐링</button>
          <button class="chip" data-value="특별한날">특별한 날</button>
          <button class="chip" data-value="해장">해장</button>
        </div>
      </div>

      <div class="field">
        <div class="label"><span class="num">02</span><span class="label-text">날씨는 어때요</span></div>
        <div class="chips" data-group="temp">
          <button class="chip" data-value="더움">더워요, 시원한 게 좋아요</button>
          <button class="chip" data-value="추움">추워요, 뜨끈한 게 좋아요</button>
          <button class="chip active" data-value="상관없음">상관없어요</button>
        </div>
      </div>

      <div class="field">
        <div class="label"><span class="num">03</span><span class="label-text">매운맛은 어느 정도로</span></div>
        <div class="chips" data-group="spice">
          <button class="chip" data-value="0">못 먹어요</button>
          <button class="chip active" data-value="1">약간이면 돼요</button>
          <button class="chip" data-value="2">매운맛 좋아요</button>
          <button class="chip" data-value="3">극한 매운맛</button>
        </div>
      </div>

      <div class="field">
        <div class="label"><span class="num">04</span><span class="label-text">누구랑 먹어요</span></div>
        <div class="chips" data-group="occasion">
          <button class="chip active" data-value="혼밥">혼밥</button>
          <button class="chip" data-value="둘이서">둘이서</button>
          <button class="chip" data-value="여럿이">여럿이 / 회식</button>
        </div>
      </div>

      <button class="draw-btn" id="drawBtn">메뉴 뽑기 →</button>
    </div>

    <div class="receipt-stage" id="stage">
      <div class="placeholder" id="placeholder">
        <span class="big-icon">?</span>
        조건을 고르고 '메뉴 뽑기'를 누르면<br>여기에 오늘의 메뉴가 인쇄돼요.
      </div>
    </div>
  </div>
</div>

<script>

  {name:"쌀국수", cat:"아시안", spice:1, temp:["더움","상관없음"], mood:["힐링","가볍게","해장"], occ:["혼밥"], desc:"향긋한 육수에 쌀면을 넣어 깔끔하게 즐기는 베트남 요리."},
  {name:"팟타이", cat:"아시안", spice:1, temp:["상관없음"], mood:["가볍게","든든하게"], occ:["둘이서"], desc:"새콤달콤한 소스로 볶은 태국식 볶음면."},
  {name:"똠양꿍", cat:"아시안", spice:3, temp:["더움"], mood:["매콤하게","해장"], occ:["둘이서","여럿이"], desc:"새콤하고 얼큰한 향신료 국물, 강렬한 한방."},
  {name:"나시고랭", cat:"아시안", spice:2, temp:["상관없음"], mood:["든든하게","매콤하게"], occ:["혼밥"], desc:"매콤한 인도네시아식 볶음밥, 계란후라이와 찰떡."},
  {name:"치킨", cat:"야식", spice:1, temp:["상관없음"], mood:["든든하게","특별한날"], occ:["둘이서","여럿이"], desc:"바삭한 튀김옷과 육즙, 야식계 부동의 1위."},
  {name:"족발", cat:"야식", spice:0, temp:["상관없음"], mood:["든든하게","특별한날"], occ:["둘이서","여럿이"], desc:"쫄깃한 껍질과 부드러운 살, 야식 회식 모두 정답."},
  {name:"곱창", cat:"야식", spice:1, temp:["추움"], mood:["든든하게","특별한날"], occ:["둘이서","여럿이"], desc:"불판 위에서 지글지글, 진한 풍미의 야식 메뉴."},
  {name:"편의점 라면+김밥", cat:"야식", spice:1, temp:["추움","상관없음"], mood:["가볍게","해장"], occ:["혼밥"], desc:"빠르고 간편하게, 그래도 든든한 조합."},
  {name:"팥빙수", cat:"디저트", spice:0, temp:["더움"], mood:["가볍게","힐링"], occ:["둘이서","여럿이"], desc:"곱게 간 얼음에 팥과 떡을 올려낸 시원한 여름 디저트."},
  {name:"크로플", cat:"디저트", spice:0, temp:["상관없음"], mood:["가볍게","특별한날"], occ:["혼밥","둘이서"], desc:"바삭하고 폭신한 크루아상 와플, 카페 인기 메뉴."},
  {name:"약과", cat:"디저트", spice:0, temp:["상관없음"], mood:["가볍게","힐링"], occ:["혼밥"], desc:"쫀득하고 달콤한 전통 한과, 은근한 중독성."}
];

const state = { mood:"든든하게", temp:"상관없음", spice:"1", occasion:"혼밥" };

document.querySelectorAll('.chips').forEach(group=>{
  const key = group.dataset.group;
  group.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      group.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state[key] = btn.dataset.value;
    });
  });
});

function scoreMenu(m){
  let score = 0;
  if(m.mood.includes(state.mood)) score += 3;
  if(state.temp === "상관없음" || m.temp.includes(state.temp) || m.temp.includes("상관없음")) score += 2;
  if(m.occ.includes(state.occasion)) score += 2;
  const wantSpice = parseInt(state.spice,10);
  if(wantSpice === 0 && m.spice === 0) score += 3;
  else if(wantSpice === 0 && m.spice > 0) score -= 6;
  else if(Math.abs(m.spice - wantSpice) === 0) score += 3;
  else if(Math.abs(m.spice - wantSpice) === 1) score += 1;
  else score -= 2;
  return score;
}

function pickMenu(){
  const scored = MENUS.map(m=>({m, s:scoreMenu(m)}));
  scored.sort((a,b)=>b.s-a.s);
  const top = scored.filter(x=>x.s >= scored[0].s - 1);
  return top[Math.floor(Math.random()*top.length)].m;
}

function spiceMeter(level){
  let out = '<div class="spice-meter">';
  for(let i=1;i<=3;i++){
    out += `<span class="${i<=level?'on':''}">●</span>`;
  }
  out += '</div>';
  return out;
}

function orderNumber(){
  return String(Math.floor(Math.random()*900)+100);
}

function renderReceipt(m){
  const stage = document.getElementById('stage');
  const now = new Date();
  const timeStr = now.toLocaleString('ko-KR', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
  stage.innerHTML = `
    <div class="receipt">
      <div class="perf top"></div>
      <div class="r-row"><span>ORDER NO. ${orderNumber()}</span><span>${timeStr}</span></div>
      <div class="r-store">오늘 뭐 먹지 식당</div>
      <div class="r-tagline">Today's Recommendation</div>
      <hr class="r-hr">
      <span class="r-cat">${m.cat}</span>
      <div class="r-item">${m.name}</div>
      <div class="r-desc">${m.desc}</div>
      <hr class="r-hr">
      <div class="r-meta-row"><span>매운맛</span>${spiceMeter(m.spice)}</div>
      <div class="r-meta-row"><span>추천 상황</span><span>${m.mood.join(' · ')}</span></div>
      <div class="r-order-no">- 오늘도 맛있는 한 끼 되세요 -</div>
      <div class="stamp">오늘의<br>추천</div>
      <div class="perf bottom"></div>
    </div>
    <button class="again-btn" id="againBtn">다시 뽑기 ↻</button>
  `;
  document.getElementById('againBtn').addEventListener('click', draw);
}

function draw(){
  const m = pickMenu();
  renderReceipt(m);
}

document.getElementById('drawBtn').addEventListener('click', draw);
</script>
</body>
</html>
